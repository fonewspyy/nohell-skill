# nohell — ชุดกฎที่ตรวจอัตโนมัติได้
# ใช้กับ CI gate: severity P1 = block, P2 = warn, P3 = report
# ข้อที่ไม่อยู่ในไฟล์นี้ = ต้องใช้คนหรือ agent อ่าน (ดู HELL-CATALOG.md)
#
# detect.kind: regex | grep | sql | cmd | manual-checklist
# engine: pcre2  = pattern ใช้ lookahead/lookbehind ต้องรันด้วย `rg -P` หรือ PCRE2 เท่านั้น
#                  บน Rust regex (rg ปกติ) หรือ grep -E จะ parse error — ถ้าตัวรันกลืน error
#                  gate จะเงียบแล้วผ่านทุกอย่าง ซึ่งแย่กว่าไม่มี gate
# multiline: true = pattern จับข้ามบรรทัด (มี \n เป็นสิ่งที่ต้อง match) ต้องรันด้วย `rg -U`
#                  ไม่ประกาศ = parse error เงียบแบบเดียวกับ pcre2 ข้างบน (validator ข้อ 13 บังคับ)
#                  `[^\n]` อย่างเดียวไม่ต้องประกาศ — มันกันบรรทัดใหม่ ไม่ได้ match มัน
# tested: repoA | no  = กฎนี้เคย fire บน repo จริงหรือยัง วัดด้วย
#                  `python scripts/nohell-check.py --full` บน repo A (SQL Server + .NET + TS)
#                  2026-08-24 ได้ 20 จาก 40 กฎ regex · ตัวเลขนี้ต้องมาจากการวัด ห้ามเดา
# experimental: true = ติดเฉพาะกฎ regex ที่ *มี runner ตรวจแล้วไม่เจอ* บน repo จริง
#                  กฎ kind: cmd/sql/manual-checklist ไม่ติดธงนี้แม้ tested: no เพราะ runner
#                  รันมันไม่ได้อยู่แล้ว การไม่มีหลักฐานจึงเป็นช่องว่างของเครื่องมือ
#                  ไม่ใช่สัญญาณว่ากฎไม่ดี
# ทุก regex ตั้งใจให้ over-match ไว้ก่อน แล้วใช้ allow เพื่อยกเว้น — false positive ถูกกว่า false negative

version: 1
gate:
  # brownfield: ห้าม "เพิ่ม" ไม่ใช่ห้าม "มี"
  # เปิด absolute วันแรกบน repo เก่าจะได้ P1 หลักพัน (ทดสอบจริง: NOLOCK ตัวเดียว 6,355 hit)
  # แล้วคนจะปิด gate ทิ้ง — gate ที่ถูกปิดมีค่าเท่ากับไม่มี
  mode: ratchet              # ratchet = เทียบกับ baseline · absolute = นับทุก hit (ใช้กับ greenfield เท่านั้น)
  baseline: .nohell-baseline.json   # รันครั้งแรกเพื่อบันทึกจำนวนปัจจุบัน แล้ว commit ไฟล์นี้
  compare: per_rule          # ต้องเทียบแยกรายกฎ ห้ามเทียบยอดรวม
  # ยอดรวมตัวเดียวทำให้ของใหม่ซ่อนหลังของเก่าที่ถูกลบได้:
  # ลบ NOLOCK 50 จุดแล้วเพิ่ม SQL injection 3 จุด ยอดรวมลดลง gate ผ่านฉลุย
  # (บทเรียนจาก repo จริงที่ทำ ratchet มาก่อน แล้วเขียนไว้ว่าเจอรูนี้มาแล้ว)
  block_on: [P1]             # ใน ratchet mode = block เมื่อ "กฎใดกฎหนึ่ง" มีจำนวนเพิ่มจาก baseline
  warn_on: [P2]
  report_on: [P3]
  always_block: []           # ID ที่ block ทันทีแม้ยังไม่เกิน baseline (ใส่เองตามความพร้อมของทีม)
  # ตัวชี้วัดที่ต้องไม่แย่ลงอยู่ใน LEG-15 (nolock_count, any_count, todo_count, ...)
  # ratchet mode คือการต่อ LEG-15 เข้ากับ gate ให้เป็นกลไกเดียวกัน

rules:

  # ---------- SQL / T-SQL ----------
  - id: SQL-01
    severity: P3
    tested: no
    title: God SP
    detect: { kind: sql, script: detect-sqlserver.sql, query: sp_size_ranking }
    threshold: { lines: 800, or_branches_on_action_param: 5 }

  - id: SQL-02
    severity: P1
    tested: no
    title: logic ซ้ำข้าม SP
    detect: { kind: sql, script: detect-sqlserver.sql, query: duplicate_sp_bodies }

  - id: SQL-04
    severity: P1
    tested: repoA
    title: dynamic SQL ต่อสตริง
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)(@sql\\s*=\\s*@sql\\s*\\+|EXEC\\s*\\(\\s*@)" }
    allow_comment: "nohell-allow: SQL-04"

  - id: SQL-05
    severity: P1
    tested: repoA
    title: SELECT * ใน SP/View
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)SELECT\\s+\\*\\s+FROM" }
    skip_comments: true   # วัดแล้ว 6/8 ตัวอย่างบน repo A เป็นโค้ดเก่าที่ comment ทิ้ง

  - id: SQL-06
    severity: P2
    tested: repoA
    title: cursor
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)\\bDECLARE\\s+\\w+\\s+CURSOR\\b" }

  - id: SQL-08
    severity: P2
    tested: no
    title: scalar UDF ใน predicate
    detect: { kind: sql, script: detect-sqlserver.sql, query: scalar_udf_usage }

  - id: SQL-10
    severity: P2
    tested: repoA
    title: non-SARGable predicate
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)WHERE[^\\n]*\\b(CONVERT|CAST|YEAR|MONTH|LEFT|SUBSTRING|ISNULL)\\s*\\(" }

  - id: SQL-15
    severity: P1
    tested: repoA
    title: NOLOCK
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)(WITH\\s*\\(\\s*NOLOCK|READUNCOMMITTED)" }

  - id: SQL-16
    severity: P2
    tested: repoA
    title: CATCH ที่กลืน error
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?is)BEGIN\\s+CATCH(?:(?!THROW|RAISERROR).)*?END\\s+CATCH" }
    engine: pcre2   # ใช้ lookaround — rg ต้องใช้ -P, grep -E รันไม่ได้

  - id: SQL-17
    severity: P2
    tested: no
    title: ไม่มี XACT_ABORT ใน SP ที่มี transaction
    detect: { kind: sql, script: detect-sqlserver.sql, query: tx_without_xact_abort }

  - id: SQL-19
    severity: P3
    tested: repoA
    title: magic status code
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)(Status|Type|Flag)\\w*\\s*(=|IN)\\s*\\(?\\s*'?\\d{1,2}'?" }

  - id: SQL-20
    severity: P2
    tested: repoA
    title: debug code ค้างใน SP
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?im)^\\s*(PRINT\\s+(@|CAST\\(|CONVERT\\(|CONCAT\\()|SELECT\\s+\\*\\s+FROM\\s+#|IF\\s+@Debug)" }
    note: >
      PRINT ที่ตามด้วย string literal คงที่ (deploy footer / operator log) ไม่ใช่ debug code
      จับเฉพาะ PRINT ที่พ่นค่าตัวแปรหรือนิพจน์ออกมา
    allow_comment: "nohell-allow: SQL-20"

  - id: SQL-23
    severity: P3
    tested: no
    title: DDL นอก migration
    detect: { kind: cmd, run: "git diff --name-only origin/main... | grep -E '\\.sql$' | grep -v '^migrations/'" }

  - id: SQL-26
    severity: P2
    tested: repoA
    title: WHILE loop update ทีละแถว
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?is)WHILE\\s*\\(?[^\\n]{0,80}\\n(?:.{0,400}?)UPDATE\\s" }
    multiline: true   # \n ข้ามบรรทัด — rg ต้องใช้ -U

  - id: SQL-27
    severity: P3
    tested: repoA
    title: ชื่อขึ้นต้น sp_
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)CREATE\\s+(OR\\s+ALTER\\s+)?PROCEDURE\\s+(\\[?dbo\\]?\\.)?\\[?sp_" }

  - id: SQL-29
    severity: P2
    tested: repoA
    title: ฟิลด์ใน JSON payload ที่เปลี่ยนพฤติกรรมของ SP
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)\"(action|actionType|mode|command|cmd|operation|op)\"\\s*:\\s*\"" }
    also:   { kind: regex, glob: "**/*.sql", pattern: "(?i)JSON_VALUE\\s*\\(\\s*@\\w+\\s*,\\s*'\\$\\.(action|mode|command|cmd|op)" }
    note: >
      payload พาข้อมูลได้ ห้ามพาคำสั่ง — — คือ @ActionType (SQL-01) ที่ย้ายไปซ่อนในที่ที่ linter มองไม่เห็น
    allow_comment: "nohell-allow: SQL-29"

  - id: SQL-30
    severity: P2
    tested: repoA
    title: OPENJSON ที่ไม่มี WITH
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?is)OPENJSON\\s*\\((?:[^()]|\\([^()]*\\))*\\)(?!\\s*(?:AS\\s+\\w+\\s*)?WITH\\s*\\()" }
    multiline: true   # lookahead (?!...WITH\s*\() ต้องมองข้ามบรรทัด ไม่งั้นฟ้องโค้ดที่ถูก
    note: ไม่มี WITH = ทุกค่าเป็น nvarchar(4000) แล้วเกิด implicit conversion ตอน join (SQL-11)
    allow_comment: "nohell-allow: SQL-30"
    engine: pcre2   # ใช้ lookaround — rg ต้องใช้ -P, grep -E รันไม่ได้

  - id: SQL-31
    severity: P3
    tested: repoA
    title: JSON payload ที่ไม่มีสัญญาประกาศไว้
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)@\\w*[Jj]son\\w*\\s+nvarchar\\s*\\(\\s*max\\s*\\)" }
    skip_comments: true   # วัดแล้ว 4/8 ตัวอย่างบน repo A อยู่ในคอมเมนต์
    note: >
      over-match โดยตั้งใจ — ทุก param JSON จะถูกจับ ให้ใส่ allow comment เฉพาะตัวที่มีบล็อกสัญญา
      (รายชื่อคีย์ ชนิด บังคับ/ไม่บังคับ และการปฏิเสธคีย์ที่ไม่รู้จัก) เขียนกำกับไว้จริง
    allow_comment: "nohell-allow: SQL-31"

  # ---------- schema ----------
  - id: DATA-01
    severity: P1
    tested: no
    title: ตารางไม่มี primary key
    detect: { kind: sql, script: detect-sqlserver.sql, query: tables_without_pk }

  - id: DATA-04
    severity: P1
    tested: no
    title: float กับคอลัมน์เงิน
    detect: { kind: sql, script: detect-sqlserver.sql, query: float_money_columns }

  - id: DATA-05
    severity: P1
    tested: no
    title: วันที่เก็บเป็นสตริง
    detect: { kind: sql, script: detect-sqlserver.sql, query: date_like_string_columns }

  - id: DATA-10
    severity: P1
    tested: no
    title: ความสัมพันธ์ที่ไม่มี FK
    detect: { kind: sql, script: detect-sqlserver.sql, query: id_columns_without_fk }

  - id: DATA-19
    severity: P2
    tested: no
    title: FK ที่ไม่มี index
    detect: { kind: sql, script: detect-sqlserver.sql, query: fk_without_index }

  - id: DATA-21
    severity: P2
    tested: no
    title: int identity ใกล้ล้น
    detect: { kind: sql, script: detect-sqlserver.sql, query: identity_headroom }
    threshold: { used_percent: 70 }

  - id: DATA-25
    severity: P1
    tested: no
    title: business key ไม่มี unique constraint
    detect: { kind: sql, script: detect-sqlserver.sql, query: docno_without_unique }

  # ---------- โค้ดแอป ----------
  - id: CODE-04
    severity: P3
    tested: repoA
    title: magic number ในเงื่อนไขธุรกิจ
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js}", pattern: "(?i)(status|state|type|code)\\s*[=!]==?\\s*[0-9]{1,3}\\b" }

  - id: CODE-07
    severity: P3
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: commented-out code
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js,sql}", pattern: "(?m)^\\s*(//|#)\\s*(if\\s*\\(|for\\s*\\(|while\\s*\\(|switch\\s*\\(|return\\s+[\\w\"'\\[\\{\\(]|(const|let|var)\\s+\\w+\\s*=|\\w+(\\.\\w+)+\\s*\\(|await\\s+\\w+).*[;{:]\\s*$" }
    note: >
      ต้องมีไวยากรณ์ของโค้ดจริงตามหลังเครื่องหมายคอมเมนต์ ไม่ใช่แค่คำแรกเป็นคีย์เวิร์ด
      ประโยคอังกฤษขึ้นต้นด้วย for/let/return เป็นเรื่องปกติ
      ตัด SQL ออกจาก pattern ทั้งหมดเพราะ SQL-21 รับหน้าที่ commented-out block ของ SQL อยู่แล้ว

  - id: CODE-18
    severity: P3
    tested: repoA
    title: TODO ไร้เจ้าของ
    detect: { kind: regex, glob: "**/*", pattern: "(?i)(TODO|FIXME|HACK)[: ]" }
    fix_hint: "รูปแบบที่ยอมรับ: TODO(ชื่อ, YYYY-MM-DD): เหตุผล"
    exclude: ["**/node_modules/**", "**/dist/**", "**/build/**", "**/.next/**", "**/vendor/**", "**/*.lock", "**/*-lock.json"]
    note: ไม่ยกเว้น node_modules แล้วตัวเลขจะเป็นหลักพันจากโค้ดที่ไม่ใช่ของเรา

  - id: CODE-20
    severity: P2
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: any / dynamic
    detect: { kind: regex, glob: "**/*.{ts,tsx}", pattern: "(?i)(:\\s*any\\b|<any>|as\\s+any\\b|any\\[\\]|Array<any>|Promise<any>|Record<[^>]*,\\s*any>|\\(\\w+:\\s*any[,)])" }
    allow_comment: "nohell-allow: CODE-20"
    note: ผูกกับตำแหน่ง type เท่านั้น ไม่จับคำว่า any ในประโยคภาษาอังกฤษ

  - id: CODE-02
    severity: P3
    tested: no
    title: ฟังก์ชันยาวเกินไป
    detect: { kind: cmd, run: "npx eslint --rule '{\"max-lines-per-function\":[\"error\",120]}'" }

  # ---------- error / resilience ----------
  - id: ERR-01
    severity: P2
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: catch ว่างเปล่า
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js}", pattern: "catch\\s*\\([^)]*\\)\\s*\\{\\s*\\}" }

  - id: ERR-02
    severity: P1
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: catch แล้ว return null
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js}", pattern: "(?s)catch\\s*\\([^)]*\\)\\s*\\{[^}]{0,200}?return\\s+(null|undefined|\\[\\]|0)\\s*;?[^}]{0,20}\\}" }

  - id: ERR-09
    severity: P2
    tested: no
    # 🪤 เคยเขียน `experimental: true` ไว้พร้อมเหตุผลว่า "runner ตรวจแล้วไม่เจอ pattern นี้
    #    บน repo จริงเลย" — ข้อสรุปนั้นผิด ตัว pattern จับไม่ได้ต่างหาก
    #    ของเดิมมีแค่ `(?i)` ไม่มี `s` แต่ใช้ `.{0,300}?` ซึ่ง `.` ไม่แมตช์ `\n`
    #    ⇒ จับได้เฉพาะกรณีที่ retry อยู่ *บรรทัดถัดไปทันที* เลื่อนลงสามบรรทัดก็เงียบ
    #    วัดแล้ว: while(true) + retry บรรทัดติดกัน = จับ · ห่างสามบรรทัด = ไม่จับ
    #    งบ 300 ตัวอักษรที่เขียนไว้เองบอกว่าตั้งใจให้ข้ามหลายบรรทัด
    #    `--multiline-dotall` ไม่ถูกส่งจาก nohell-check.py (มีแค่ -U กับ -P) จึงต้องฝัง `s` ใน pattern
    #    เติม `s` เฉย ๆ ไม่พอ: `.` จะข้ามออกไปนอกลูปแล้วจับ fetch ในฟังก์ชันอื่น (วัดแล้วว่าเกิด)
    #    จึงใช้ tempered dot `(?!\n\})` กันไม่ให้ข้าม `}` ต้นบรรทัดซึ่งเป็นขอบลูป
    title: retry ไม่จำกัดจำนวน
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js}", pattern: "(?is)while\\s*\\(\\s*true\\s*\\)[^\\n]{0,80}\\n(?:(?!\\n\\}).){0,300}?(retry|fetch|axios|HttpClient)" }
    multiline: true   # \n ข้ามบรรทัด — rg ต้องใช้ -U
    engine: pcre2     # ใช้ negative lookahead ใน tempered dot

  - id: TXN-19
    severity: P1
    tested: no
    title: MERGE ไม่มี HOLDLOCK
    # ตั้งใจ over-match: regex เห็นแค่ว่าสเตทเมนต์ MERGE ไม่มีคำว่า HOLDLOCK/SERIALIZABLE
    # มองไม่เห็นสองอย่างที่ตัดสินว่าผิดจริงไหม — คีย์ใน ON มี unique constraint หนุนอยู่แล้วหรือเปล่า
    # และ MERGE ตัวนั้นเจอ concurrent writer จริงไหม (batch job ที่รันตัวเดียวไม่เสี่ยงเลย)
    # และจับไม่ได้ถ้า SERIALIZABLE ถูกตั้งที่ระดับ session ด้วย SET TRANSACTION ISOLATION LEVEL
    # จึงเป็น P1 ที่ต้องให้คนยืนยันรายจุด ไม่ใช่ block อัตโนมัติ
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?is)MERGE\\s+(?:INTO\\s+)?(?:(?!;)(?!HOLDLOCK)(?!SERIALIZABLE).)*?;" }
    multiline: true   # สเตทเมนต์ MERGE คร่อมหลายบรรทัดจนถึง ; — rg ต้องใช้ -U
    engine: pcre2     # ใช้ negative lookahead ใน tempered dot
    note: >
      ต้องมี s ใน (?is) — nohell-check.py ส่งแค่ -U กับ -P ไม่ส่ง --multiline-dotall
      ถ้าไม่ฝัง s ไว้ `.` จะไม่ข้าม \n แล้วกฎนี้จับอะไรไม่ได้เลยแบบเงียบ ๆ (ดู ERR-09)
    allow_comment: 'nohell-allow: TXN-19'

  - id: ERR-11
    severity: P2
    tested: repoA
    title: HTTP call ไม่มี timeout
    detect: { kind: regex, glob: "**/*.{ts,tsx,js}", pattern: "(?<!AbortSignal\\.)fetch\\s*\\([^)]*\\)(?![^;]{0,120}signal)" }
    engine: pcre2   # ใช้ lookaround — rg ต้องใช้ -P, grep -E รันไม่ได้

  - id: PERF-09
    severity: P2
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: block async
    detect: { kind: regex, glob: "**/*.cs", pattern: "\\.(Result|Wait\\(\\))\\b" }

  # ---------- security ----------
  - id: SEC-01
    severity: P1
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: SQL injection จากการต่อสตริง
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js}", pattern: "(?i)\\b(INSERT\\s+INTO\\b|DELETE\\s+FROM\\b|UPDATE\\s+[\\w.\\[\\]]+\\s+SET\\b|SELECT\\b[^;]{0,200}?\\bFROM\\b)[^;]{0,200}?(\\$\\{|\\+\\s*\\w+|\\bformat\\()" }
    note: >
      บังคับให้ต้องมีรูปร่างของคำสั่ง SQL จริง (INSERT INTO / DELETE FROM / UPDATE x SET / SELECT..FROM)
      ไม่ใช่แค่มีคำว่า select-insert-update-delete โผล่ในข้อความ
      วัดบน repo จริง: pattern เดิมให้ 221 hit โดยเป็นช่องโหว่จริง 0 เพราะคำว่า "Inserted" และ "selection"
      ถูกนับเป็น SQL keyword

  - id: SEC-02
    severity: P1
    tested: no
    title: secret ใน repo
    detect: { kind: cmd, run: "gitleaks detect --no-banner" }

  - id: SEC-04
    severity: P1
    tested: repoA
    title: hash รหัสผ่านที่อ่อนแอ
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js,sql}", pattern: "(?i)\\b(MD5|SHA1)\\b" }

  - id: SEC-10
    severity: P1
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: CORS เปิดกว้าง
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js,json,yaml}", pattern: "(?i)(Access-Control-Allow-Origin\\s*[:=]\\s*[\"']?\\*|origin\\s*:\\s*[\"']\\*[\"'])" }

  - id: SEC-15
    severity: P1
    tested: no
    title: dependency ที่มีช่องโหว่
    detect: { kind: cmd, run: "pnpm audit --audit-level high" }

  - id: SEC-18
    severity: P1
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: connection string ใช้สิทธิ์สูงสุด
    detect: { kind: regex, glob: "**/*.{json,config,env,yaml}", pattern: "(?i)(User\\s*Id|uid)\\s*=\\s*(sa|root|admin)\\b" }

  - id: OBS-05
    severity: P1
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: log ข้อมูลอ่อนไหว
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js}", pattern: "(?i)(log|logger|console)\\.\\w+\\([^)]*\\b(password|token|secret|apikey|citizen|idcard|cardno)\\b" }

  # ---------- config / ship ----------
  - id: CFG-02
    severity: P2
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: branch ตาม environment ในโค้ดธุรกิจ
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js}", pattern: "(?i)(NODE_ENV|ASPNETCORE_ENVIRONMENT|env)\\s*[=!]==?\\s*[\"'](prod|production)[\"']" }

  - id: CFG-03
    severity: P3
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: hard-code URL/IP
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js}", pattern: "(?i)https?://(?![^/\\s\"']*(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\[::1\\]|example\\.(com|org|net)|schema\\.org|nextjs\\.org|w3\\.org|[\\w.-]+\\.(invalid|test|example|localhost))\\b)[\\w.-]+|\\b(?!127\\.0\\.0\\.1\\b|0\\.0\\.0\\.0\\b|255\\.255\\.255\\.255\\b|192\\.0\\.2\\.\\d|198\\.51\\.100\\.\\d|203\\.0\\.113\\.\\d)\\d{1,3}(\\.\\d{1,3}){3}\\b" }
    engine: pcre2   # ใช้ lookaround — rg ต้องใช้ -P, grep -E รันไม่ได้
    exclude: ['**/__tests__/**', '**/*.test.*', '**/*.spec.*', '**/*.d.ts', '**/generated/**', '**/*.gen.ts', '**/*.openapi.ts']
    note: >
      ยกเว้น loopback โดเมนตัวอย่าง และช่วง IP สำหรับเอกสารตาม RFC 5737
      และไม่สแกนไฟล์เทสกับไฟล์ที่ generate เพราะ URL/IP ในนั้นคือ fixture ไม่ใช่คอนฟิก

  - id: CFG-04
    severity: P2
    tested: repoA
    title: path ตายตัวแบบ Windows
    detect: { kind: regex, glob: "**/*.{ts,tsx,cs,js,sql}", pattern: "[A-Za-z]:\\\\\\\\?[\\w\\\\ .-]+" }

  - id: CFG-08
    severity: P1
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: ค่าเริ่มต้นที่อันตราย
    detect: { kind: regex, glob: "**/*.{json,yaml,config,env}", pattern: "(?i)(debug\\s*[:=]\\s*true|EnableSensitiveDataLogging|AllowAnonymous\\s*[:=]\\s*true)" }

  - id: SHIP-05
    severity: P2
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: migration ที่ไม่ idempotent
    detect: { kind: regex, glob: "migrations/**/*.sql", pattern: "(?i)^(?!.*IF\\s+(NOT\\s+)?EXISTS).*\\b(CREATE|ALTER|DROP)\\s+(TABLE|INDEX|PROCEDURE|VIEW)" }
    engine: pcre2   # ใช้ lookaround — rg ต้องใช้ -P, grep -E รันไม่ได้

  - id: SHIP-15
    severity: P2
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: dependency ไม่ pin
    detect: { kind: regex, glob: "**/package.json", pattern: "\"[^\"]+\"\\s*:\\s*\"(\\*|latest|\\^?0\\.0\\.0)\"" }

  - id: SHIP-09
    severity: P3
    tested: no
    title: commit ใหญ่เกินไป
    detect: { kind: cmd, run: "git diff --stat origin/main... | tail -1" }
    threshold: { files: 40 }

  # ---------- test ----------
  - id: TEST-03
    severity: P3
    tested: no
    title: flaky test
    detect: { kind: cmd, run: "npm test -- --runInBand --repeat 3" }

  - id: TEST-06
    severity: P3
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: sleep ในเทส
    detect: { kind: regex, glob: "**/*.{test,spec}.{ts,tsx,js}", pattern: "(setTimeout|sleep|Thread\\.Sleep|delay)\\s*\\(\\s*[0-9]{3,}" }

  - id: TEST-15
    severity: P2
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: เทสที่ถูก skip
    detect: { kind: regex, glob: "**/*.{test,spec}.{ts,tsx,js}", pattern: "\\b(it|test|describe)\\.(skip|todo)\\b|\\[Ignore\\]" }

  - id: AI-13
    severity: P2
    tested: no
    title: คอมมิตที่แก้บั๊กพร้อมลบเทส
    detect: { kind: cmd, run: "git diff --stat origin/main... -- '**/*.test.*' '**/*.spec.*'" }
    condition: "มีบรรทัดเทสถูกลบในคอมมิตที่ประเภทเป็น fix"

  # ---------- frontend ----------
  - id: FE-07
    severity: P1
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: endpoint ที่ไม่ validate ด้วย schema
    detect: { kind: regex, glob: "**/routes/**/*.ts", pattern: "(?s)\\.(post|put|patch)\\((?:(?!zValidator|parse\\(|safeParse).)*?\\)" }
    engine: pcre2   # ใช้ lookaround — rg ต้องใช้ -P, grep -E รันไม่ได้

  - id: FE-14
    severity: P2
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: console.log ค้าง
    detect: { kind: regex, glob: "src/**/*.{ts,tsx,js}", pattern: "console\\.(log|debug|dir)\\(" }

  - id: FE-13
    severity: P3
    tested: no
    experimental: true   # มี runner ตรวจแล้วไม่เจอ pattern นี้บน repo จริงเลย
    title: import ไลบรารีทั้งก้อน
    detect: { kind: regex, glob: "**/*.{ts,tsx,js}", pattern: "from\\s+['\"](lodash|moment|rxjs)['\"]" }

  # ---------- SSOT / วง C: สร้าง C แล้วต้องลบ A,B ----------
  - id: SSOT-01
    severity: P3
    tested: no
    title: สร้าง C แล้วไม่ลบ A/B
    detect: { kind: cmd, run: "nohell consolidation-check" }
    condition: >
      PR ที่เพิ่มไฟล์/SP ใหม่ซึ่งมีชื่อหรือ dependency ทับกับของเดิม
      ต้องมี id ใน CONSOLIDATIONS.yaml ที่อ้างถึงของเดิมในรายการ remove
    fix_hint: "เพิ่มบรรทัดในทะเบียน หรือลบของเดิมใน PR เดียวกันไปเลย"

  - id: SSOT-02
    severity: P1
    tested: no
    title: ขึ้นสถานะ C2 โดยไม่มีหลักฐานความเท่ากัน
    detect: { kind: cmd, run: "nohell consolidation-check --require equivalence_evidence --state C2,C3,C4" }

  - id: SSOT-03
    severity: P3
    tested: repoA
    title: C ที่รับ flag ครอบทุกเคส (God SP ตัวใหม่)
    detect: { kind: regex, glob: "**/*.sql", pattern: "(?i)@(Action|Mode|Type|Flag)\\w*\\s+\\w*(char|int)" }
    threshold: { distinct_branch_values: 5 }

  - id: SSOT-04
    severity: P3
    tested: no
    title: ไม่มีบัญชีผู้เรียกของ A/B
    detect: { kind: cmd, run: "nohell consolidation-check --require callers_remaining" }
    helper: { kind: sql, script: detect-sqlserver.sql, query: sp_call_graph }

  - id: SSOT-07
    severity: P3
    tested: no
    title: งาน consolidation ที่บรรทัดสุทธิเพิ่ม
    detect: { kind: cmd, run: "git diff --numstat origin/main... | awk '{a+=$1;d+=$2} END{print a-d}'" }
    condition: "ใช้เฉพาะ PR ที่อ้าง id ของ CONSOLIDATIONS.yaml — ค่าต้องติดลบ"

  - id: SSOT-10
    severity: P2
    tested: no
    title: วง C ค้างเกินกำหนด
    detect: { kind: cmd, run: "nohell consolidation-check --expired" }
    threshold: { max_days_in_C2: 30, max_days_total: 90 }

  - id: SSOT-11
    severity: P3
    tested: no
    title: ยกเลิกแล้วทิ้ง C ไว้
    detect: { kind: manual-checklist }
    items: ["ถ้าถอนวง C ออกจากทะเบียน ต้องมีคอมมิตที่ลบ C ในรอบเดียวกัน"]

  - id: SSOT-15
    severity: P1
    tested: no
    title: ทางเขียนของเดิมยังเปิดอยู่หลังประกาศ SSOT
    detect: { kind: sql, script: detect-sqlserver.sql, query: duplicate_sp_dependencies }
    condition: "ตารางที่ประกาศเป็นแหล่งเดียว ต้องมีผู้เขียนเพียงเส้นทางเดียว"

  - id: SSOT-17
    severity: P3
    tested: repoA
    title: ชื่อที่บอกว่าเป็นเวอร์ชันใหม่
    detect: { kind: regex, glob: "**/*.{sql,ts,tsx,cs}", pattern: "(?i)(CREATE|ALTER)\\s+(OR\\s+ALTER\\s+)?(PROCEDURE|PROC|VIEW|FUNCTION|TABLE)\\s+[\\w\\[.\\]]*(_?v[2-9]|_new|_final|_latest|_copy|copyof)\\b" }
    also:   { kind: regex, glob: "**/*.{ts,tsx,cs}", pattern: "(?i)(class|interface|type|enum)\\s+\\w*(V[2-9]|_new|_final|_latest|Copy)\\b" }
    note: ผูกกับจุดที่ตั้งชื่อ object ใหม่ ไม่จับ #temp/CTE ชื่อ _FINAL/_LATEST ซึ่งเป็นชื่อ stage ไม่ใช่เวอร์ชัน

  # ---------- fitness function (วัดแนวโน้ม ไม่ใช่จุดเดียว) ----------
  - id: LEG-15
    severity: P3
    tested: no
    title: fitness function — ห้ามแย่ลง
    detect: { kind: cmd, run: "nohell metrics" }
    metrics:
      - { name: sp_count,            direction: non_increasing }
      - { name: total_sql_loc,       direction: non_increasing }
      - { name: max_sp_lines,        direction: non_increasing }
      - { name: duplicate_sp_groups, direction: non_increasing }
      - { name: any_count,           direction: non_increasing }
      - { name: nolock_count,        direction: non_increasing }
      - { name: todo_count,          direction: non_increasing }

  # ---------- ข้อที่ตรวจอัตโนมัติไม่ได้ แต่บังคับผ่าน checklist ของ PR ----------
  - id: PR-CHECKLIST
    severity: P1
    tested: no
    detect: { kind: manual-checklist }
    items:
      - "ARCH-08: rule ที่แก้ครั้งนี้ มีอยู่ที่อื่นในระบบหรือไม่ (ค้นก่อนตอบ)"
      - "SQL-02: มี SP อื่นที่ทำเรื่องเดียวกันหรือไม่"
      - "TXN-06: เส้นทางนี้รันซ้ำแล้วผลเหมือนเดิมหรือไม่"
      - "ERR-15: ถ้าพัง จะตามจาก log ได้หรือไม่"
      - "API-02: การเปลี่ยนแปลงนี้ทำให้ผู้ใช้เดิมพังหรือไม่"
      - "LEG-02: มีตาข่าย (เทส/ข้อมูลจริง) ก่อนแตะโค้ดเก่าหรือไม่"
      - "AI-06: business rule ในโค้ดนี้อ้างแหล่งได้หรือไม่ หรือเป็นการเดา"
      - "AI-05: รันจริงจนจบเส้นทางแล้วหรือยัง"
      - "TEAM-16: ก้อนนี้มีเจ้าของหรือไม่"
      - "SSOT-01: PR นี้สร้างของใหม่ทับของเดิมหรือไม่ ถ้าใช่ ของเดิมจะถูกลบเมื่อไหร่ ใครลบ"
      - "SSOT-02: พิสูจน์แล้วหรือยังว่าของที่จะรวมทำเรื่องเดียวกันจริง ไม่ใช่แค่หน้าตาเหมือน"
      - "SSOT-13: ข้อมูลรวมเป็นแหล่งเดียวด้วยหรือยัง หรือรวมแค่โค้ด"
      - "nohell-debt: ทางลัดที่ทิ้งไว้ถูกบันทึกหรือยัง"

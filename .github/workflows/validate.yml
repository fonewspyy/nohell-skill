name: validate

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ตรวจว่าแคตตาล็อกสอดคล้องกับตัวเอง
        run: sh scripts/validate-catalog.sh
      - name: ตรวจว่าตารางสรุปตรงกับข้อมูลจริง
        run: python3 scripts/build-summary.py --check

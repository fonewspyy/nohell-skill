name: validate

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # nohell-check ต้องมีประวัติเพื่อ diff เทียบ base ของ PR
      - name: ตรวจว่าแคตตาล็อกสอดคล้องกับตัวเอง
        run: sh scripts/validate-catalog.sh
      - name: ตรวจว่าตัวเลขที่ประกาศตรงกับของจริง
        run: python3 scripts/build-summary.py --check

      # pyyaml ไม่ใช่ stdlib — nohell-check ประกาศชัดว่าต้องมี และ fail ดังถ้าไม่มี
      # ติดตั้งที่นี่ให้เห็น ดีกว่าให้ runner เดาว่ามีหรือไม่มี
      - name: ติดตั้ง pyyaml
        run: python3 -m pip install --quiet pyyaml

      # 🪤 CI แดงติดกันทุกรอบตั้งแต่ 2026-08-25 เพราะ runner ไม่มี rg — ไม่ใช่เพราะเทสตก
      #    ทุกเคสใน test-nohell-check.sh ล้มพร้อมบรรทัดเดียวกัน "ไม่พบ ripgrep (rg)"
      #    อ่าน CI แล้วเห็น "FAIL 12 เคส" ซึ่งพาไปหาบั๊กในกฎ ทั้งที่กฎไม่เคยถูกรันเลย
      #    ⇒ ขั้นที่ขาดไปต้องดังตรงนี้ ไม่ใช่ไปโผล่เป็นเทสตกทีหลัง
      - name: ติดตั้ง ripgrep
        # update ก่อนเสมอ — apt list ที่ฝังมากับ runner image ค้างได้เป็นวัน
        # แล้ว install จะล้มด้วย 404 ซึ่งอ่านเหมือน "ไม่มีแพ็กเกจนี้" ไม่ใช่ "รายการค้าง"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep

      # nohell-check ตายด้วย exit 2 ถ้า rg ไม่มี +pcre2 (กฎที่ประกาศ engine: pcre2
      # จะ parse error แล้ว gate จะเงียบ = ผ่านทุกอย่าง) เช็คแยกให้ข้อความชัดว่าเป็น
      # เรื่องของ build ที่ distro ให้มา ไม่ใช่เรื่องของกฎในรีโปนี้
      - name: ยืนยันว่า rg ตัวนี้มี PCRE2
        run: |
          rg --version
          rg --version | grep -q '+pcre2' \
            || { echo "rg ที่ apt ให้มา build มาโดยไม่มี PCRE2 — ต้องเปลี่ยนไปใช้ binary จาก release ของ ripgrep"; exit 1; }

      # frontmatter ที่หลุดมาตรฐานพังตอน *คนอื่น* ติดตั้ง ไม่ใช่ตอนเราแก้ จึงไม่มีทางรู้เองถ้าไม่มีด่าน
      - name: ตรวจว่า SKILL.md ยังติดตั้งได้ทุกช่องทาง
        run: python3 scripts/validate-skills.py

      - name: เทสของ nohell-check (เคส diff ที่รู้คำตอบ)
        run: sh scripts/test-nohell-check.sh
        env:
          PY: python3

      # build-summary เขียนทับเอกสาร 14 ไฟล์ จึงต้องมีเทส ไม่ใช่พึ่งการอ่าน diff ทีละครั้ง
      - name: เทสของ build-summary (เคสที่รู้คำตอบ)
        run: sh scripts/test-build-summary.sh
        env:
          PY: python3

      # 🪤 สองด่านนี้มีอยู่ในรีโปแต่ไม่เคยถูกต่อสายเข้า CI — คลาสเดียวกับที่ rg ไม่ถูกติดตั้ง
      #    ด่านที่ไม่ถูกเรียกกับด่านที่ไม่มีอยู่ ให้ผลเหมือนกันเป๊ะ
      #    ⚠️ เรียกด้วย `bash` ไม่ใช่ `sh` — สองตัวนี้ประกาศ `#!/usr/bin/env bash` และใช้
      #       `set -o pipefail` ซึ่ง dash ไม่มี (ต่างจากสามตัวข้างบนที่เป็น POSIX จริง)
      - name: เทสของตัวตรวจ version pin (เคสที่รู้คำตอบ)
        run: bash scripts/test-version-pins.sh
      - name: ตรวจว่าคำสั่งติดตั้งปักรุ่นตรงกับ CHANGELOG
        run: bash scripts/check-version-pins.sh

      # กินยาตัวเอง — บน PR ให้รันกฎกับบรรทัดที่ PR นี้เพิ่มเท่านั้น
      # ไม่ใช้ --full เพราะจะเป็นการตัดสินโค้ดเก่า ซึ่งไม่ใช่สิ่งที่ ratchet ทำ
      - name: nohell-check diff-only
        if: github.event_name == 'pull_request'
        run: python3 scripts/nohell-check.py --base "origin/${{ github.base_ref }}"
